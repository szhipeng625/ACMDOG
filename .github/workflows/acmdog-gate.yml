name: ACMDOG Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gate:
    name: run business checks
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: checkout pushed code
        uses: actions/checkout@v4

      - name: run gate test cases
        run: bash tests/run_tests.sh

      - name: write stage summary
        if: always()
        run: python3 .github/scripts/write_summary.py tests/out/run.log

      - name: upload stage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: tests/out/
          retention-days: 30
          if-no-files-found: warn
