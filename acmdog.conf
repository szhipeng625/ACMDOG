server {
    charset utf-8;
    server_name www.acmdog.cn acmdog.cn;
    root /usr/share/nginx/html/oj;
    index index.html;

    location /vh {
        alias /usr/share/nginx/html/vh;
        index index.html;
        try_files $uri $uri/ /vh/index.html;
    }
    location /vh/api/ {
        proxy_pass http://43.157.39.171:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /store/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location ~* ^/store/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_cache off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /store/api/ {
        proxy_pass http://43.157.39.171:9000/api/;
        proxy_set_header Host 43.157.39.171;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /store {
        return 301 /store/;
    }
    location /ng {
        charset utf-8;
        alias /usr/share/nginx/html/ng;
        index oj_changelog.html;
        autoindex off;
    }

    location /ip/api {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ip {
        charset utf-8;
        alias /usr/share/nginx/html/oj/ip;
        index index.html;
        autoindex off;
    }
    location /db {
        alias /usr/share/nginx/html/db/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location /mq {
        alias /usr/share/nginx/html/mq/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /oj/hydro/ {
        alias /usr/share/nginx/html/oj/hydro/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location /api/cloud_login {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_register {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_whoami {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_judge_stream {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }
    location /api/cloud_judge {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 5s;
    }
    location /api/cloud_problems {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_problem {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_contests {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_contest {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_contest_pdf {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/cloud_contest_register {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_contest_data_prepare {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_contest_data_cleanup {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cloud_contest_board {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/anime/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 320s;
    }

    location /oj-admin/ {
        proxy_pass http://127.0.0.1:18083/oj-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ai/ {
        proxy_pass http://127.0.0.1:18082/api/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location /llvm_test/ {
        alias /usr/share/nginx/html/oj/llvm_test/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /llvm_test {
        return 301 /llvm_test/;
    }
    location = /llvm_test/events {
        proxy_pass http://127.0.0.1:18900/events.sse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /ui { return 301 /ui/; }
    location /pylite {
        alias /usr/share/nginx/html/pylite;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location /pylite_run/api/ {
        proxy_pass http://127.0.0.1:18090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /pylite_run/ {
        alias /usr/share/nginx/html/pylite_run/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /pylite_run {
        return 301 /pylite_run/;
    }

    location /ui/ {
        alias /usr/share/nginx/html/ui/;
        index index.html;
        try_files $uri $uri/ =404;
    }


    listen 127.0.0.1:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.acmdog.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.acmdog.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.acmdog.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.acmdog.cn acmdog.cn;
    return 404; # managed by Certbot


}