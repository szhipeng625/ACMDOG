server {
    listen 80;
    server_name www.acmdog.cn acmdog.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name www.acmdog.cn acmdog.cn;

    ssl_certificate /etc/letsencrypt/live/www.acmdog.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.acmdog.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /vh {
        alias /usr/share/nginx/html/vh;
        try_files $uri $uri/ /vh/index.html;
    }

    location /vh/api/ {
        proxy_pass http://43.157.39.171:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /store/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /store/api/ {
        proxy_pass http://43.157.39.171:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ng { alias /usr/share/nginx/html/ng; try_files $uri $uri/ /ng/index.html; }
    location /ip { alias /usr/share/nginx/html/ip; try_files $uri $uri/ /ip/index.html; }
    location /db { alias /usr/share/nginx/html/db; try_files $uri $uri/ /db/index.html; }
    location /mq { alias /usr/share/nginx/html/mq; try_files $uri $uri/ /mq/index.html; }
    location /oj/hydro/ { alias /usr/share/nginx/html/oj/hydro/; try_files $uri $uri/ /oj/hydro/index.html; }

    location /api/cloud_judge/ { proxy_pass http://127.0.0.1:18081/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/cloud_submit/ { proxy_pass http://127.0.0.1:18081/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/cloud_result/ { proxy_pass http://127.0.0.1:18081/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/cloud_status/ { proxy_pass http://127.0.0.1:18081/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/anime/ { proxy_pass http://127.0.0.1:18081/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /oj-admin/ { proxy_pass http://127.0.0.1:18083/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/ai/ { proxy_pass http://127.0.0.1:18082/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /llvm_test/ { alias /usr/share/nginx/html/llvm_test/; try_files $uri $uri/ /llvm_test/index.html; }
    location /llvm_test/events { proxy_pass http://127.0.0.1:18900; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /pylite { alias /usr/share/nginx/html/pylite; try_files $uri $uri/ /pylite/index.html; }
    location /pylite_run/ { alias /usr/share/nginx/html/pylite_run/; try_files $uri $uri/ /pylite_run/index.html; }
    location /pylite_run/api/ { proxy_pass http://127.0.0.1:18090/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /ui/ { alias /usr/share/nginx/html/ui/; try_files $uri $uri/ /ui/index.html; }
    location /ip/api { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
